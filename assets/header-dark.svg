<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" fill="none">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .ink { fill: #e6edf3; } .soft { fill: #9198a1; } .muted { fill: #656d76; }
  
  .orbit { transform-origin: 840px 150px; animation: spin 30s linear infinite; }
  .orbit2 { transform-origin: 840px 150px; animation: spin 12s linear infinite reverse; }
  .rise { opacity: 0; animation: rise 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
  .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g class="rise"><text x="0" y="70" class="mono muted" font-size="15" letter-spacing="4">SHINO-01</text></g>
<g class="rise d2"><text x="-4" y="150" class="sans ink" font-size="76" font-weight="300" letter-spacing="-2.5">Sakif Hussain</text></g>
<g class="rise d3">
  <line x1="0" y1="190" x2="48" y2="190" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="0" y="230" class="mono soft" font-size="17">software engineer · builds small tools and quiet interfaces</text>
</g>
<circle cx="840" cy="150" r="96" stroke="#30363d" stroke-width="1"/>
<circle cx="840" cy="150" r="56" stroke="#30363d" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
<circle cx="840" cy="150" r="4.5" fill="#e6edf3"/>
<g class="orbit"><circle cx="936" cy="150" r="4" fill="#e6edf3"/></g>
<g class="orbit2"><circle cx="840" cy="94" r="2.5" fill="#656d76"/></g>
</svg>
