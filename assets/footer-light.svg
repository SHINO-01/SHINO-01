<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 0 960 140" fill="none">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .ink { fill: #1f2328; } .soft { fill: #57606a; } .muted { fill: #8c959f; }
  .orbit { transform-origin: 480.0px 60px; animation: spin 20s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

